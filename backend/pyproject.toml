[tool.poetry]
name = "hik-video-dashboard-backend"
version = "0.2.0"
description = "HIK video dashboard REST backend (purest)"
authors = ["Jaroslaw Locchansky <locchansky@gmail.com>"]
packages = [{include = "hvd"}]

[tool.poetry.dependencies]
python = ">3.10,<3.14"
sqlalchemy = ">2.0,<2.1"
# Git submodule at ../purest. For local sibling hik-web-dev/purest during
# tests/dev, run: ../scripts/use-local-purest.sh
purest = {path = "../purest", develop = true}
# Production / local are PostgreSQL-only (see hvd.db.require_postgres).
psycopg2-binary = {version = ">=2.9,<3", optional = true}
pillow = ">=10.0,<12"

[tool.poetry.extras]
postgresql = ["psycopg2-binary"]

[tool.poetry.scripts]
hvd = "hvd.main:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
