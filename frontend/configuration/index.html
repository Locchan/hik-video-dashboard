<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="config.title">Configuration — HIK Video Dashboard</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="wrap">
      <div class="topbar">
        <h1 data-i18n="config.heading">Configuration</h1>
        <div class="actions">
          <button type="button" id="btn-new" data-i18n="config.new" hidden>New entry</button>
        </div>
      </div>
      <p id="page-error" class="error" role="alert"></p>
      <p id="config-disabled" class="muted" data-i18n="config.disabled" hidden>
        The configuration feature is disabled.
      </p>

      <section class="section-box" id="features-section" hidden>
        <h2 data-i18n="features.heading">Features</h2>
        <p id="features-error" class="error" role="alert"></p>
        <div class="table-wrap">
          <table class="config" id="features-table">
            <thead>
              <tr>
                <th data-i18n="features.col.name">Name</th>
                <th data-i18n="features.col.description">Description</th>
                <th data-i18n="features.col.enabled">Enabled</th>
              </tr>
            </thead>
            <tbody id="features-body"></tbody>
          </table>
        </div>
      </section>

      <section class="section-box" id="config-section" hidden>
        <h2 data-i18n="config.entries.heading">Config entries</h2>
        <div class="table-wrap">
          <table class="config">
            <thead>
              <tr>
                <th data-i18n="config.col.key">Key</th>
                <th data-i18n="config.col.value">Value</th>
                <th data-i18n="config.col.actions">Actions</th>
              </tr>
            </thead>
            <tbody id="config-body"></tbody>
          </table>
        </div>
      </section>

      <div class="panels-row">
        <section class="section-box panel" id="account-panel">
          <h2 data-i18n="account.heading">Account</h2>
          <div class="card stack narrow" id="language-card">
            <label>
              <span data-i18n="account.language">Language</span>
              <select id="language-select">
                <option value="en" data-i18n="account.lang.en">English</option>
                <option value="ru" data-i18n="account.lang.ru">Russian</option>
              </select>
            </label>
          </div>
          <form id="self-password-form" class="card stack narrow">
            <label>
              <span data-i18n="account.new_password">New password</span>
              <input id="self-password" type="password" required minlength="8" autocomplete="new-password" />
            </label>
            <label>
              <span data-i18n="account.confirm_password">Confirm password</span>
              <input id="self-password-confirm" type="password" required minlength="8" autocomplete="new-password" />
            </label>
            <p id="self-password-error" class="error" role="alert"></p>
            <button type="submit" data-i18n="account.change_password">Change my password</button>
          </form>
        </section>

        <section class="section-box panel" id="admin-panel" hidden>
          <h2 data-i18n="users.heading">Users</h2>
          <p id="admin-error" class="error" role="alert"></p>
          <form id="create-user-form" class="card stack narrow" hidden>
            <h3 data-i18n="users.create">Create user</h3>
            <label>
              <span data-i18n="users.username">Username</span>
              <input id="create-username" type="text" required minlength="4" autocomplete="off" />
            </label>
            <label>
              <span data-i18n="users.password">Password</span>
              <input id="create-password" type="password" required minlength="8" autocomplete="new-password" />
            </label>
            <button type="submit" data-i18n="users.create_btn">Create</button>
          </form>
          <div class="table-wrap" id="users-table-wrap" hidden>
            <table class="config">
              <thead>
                <tr>
                  <th data-i18n="users.col.username">Username</th>
                  <th data-i18n="users.col.group">Group</th>
                  <th data-i18n="users.col.loginable">Loginable</th>
                  <th data-i18n="users.col.set_password">Set password</th>
                </tr>
              </thead>
              <tbody id="users-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
    <div id="site-footer"></div>
    <script src="/js/version.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/features.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/configuration.js"></script>
  </body>
</html>
