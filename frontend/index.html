<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="login.title">Login — HIK Video Dashboard</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <main class="login-wrap">
      <h1 data-i18n="login.heading">Login</h1>
      <form id="login-form" class="card stack" autocomplete="on">
        <label>
          <span data-i18n="login.username">Username</span>
          <input id="username" name="username" type="text" required minlength="4" />
        </label>
        <label>
          <span data-i18n="login.password">Password</span>
          <input id="password" name="password" type="password" required />
        </label>
        <p id="login-error" class="error" role="alert"></p>
        <button type="submit" data-i18n="login.submit">Sign in</button>
      </form>
    </main>
    <script src="/js/i18n.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/features.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
