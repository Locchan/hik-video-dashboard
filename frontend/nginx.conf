server {
    listen 5482;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location /alerts/ {
        try_files $uri $uri/ /alerts/index.html;
    }

    location /configuration/ {
        try_files $uri $uri/ /configuration/index.html;
    }
}
