# Local frontend: static files + /api/ strip → backend on 127.0.0.1:5480
# (same shape as host nginx for hvd.locchan.dev). Use with --network host.
server {
    listen 5482;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5480/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Live MPEG-TS WebSockets (purest WS port).
    location /ws/ {
        proxy_pass http://127.0.0.1:5481/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location /alerts/ {
        try_files $uri $uri/ /alerts/index.html;
    }

    location /streaming/ {
        try_files $uri $uri/ /streaming/index.html;
    }

    location /configuration/ {
        try_files $uri $uri/ /configuration/index.html;
    }

    location /help/ {
        try_files $uri $uri/ /help/index.html;
    }
}
